services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-api-app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: auth_api
      DB_USERNAME: auth_api
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: auth-api-db
    environment:
      POSTGRES_DB: auth_api
      POSTGRES_USER: auth_api
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_api -d auth_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  laravel_vendor: